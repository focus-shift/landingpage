name: Build and deploy github pages

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Validate built pages
        run: npm run check:dist
      - name: Upload './dist' directory
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: ./dist

  link-check:
    needs:
      - build
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-link-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download './dist' directory
        uses: actions/download-artifact@v8
        with:
          name: dist-files
          path: ./dist
      # LinkChecker throttles requests to ~3 per second per host. A "LinkChecker"
      # response header allows raising that limit via maxrequestspersecond.
      - name: Serve './dist' directory
        run: |
          python3 - <<'EOF' &
          import functools, http.server
          class Handler(http.server.SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header("LinkChecker", "unthrottled")
                  super().end_headers()
          handler = functools.partial(Handler, directory="dist")
          http.server.ThreadingHTTPServer(("", 3000), handler).serve_forever()
          EOF
      - name: Wait for server
        run: |
          for i in {1..20}; do
            if curl -s -o /dev/null http://localhost:3000/; then
              echo "Server is running!"
              break
            fi
            echo "Waiting for server..."
            sleep 1
          done
      - name: Check internal links
        run: |
          printf '[checking]\nmaxrequestspersecond=1000\n' > linkcheckerrc
          docker run --rm --network host -v "$PWD/linkcheckerrc:/linkcheckerrc:ro" ghcr.io/linkchecker/linkchecker:latest --config /linkcheckerrc --threads 30 http://localhost:3000

  deploy:
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - link-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download './dist' directory
        uses: actions/download-artifact@v8
        with:
          name: dist-files
          path: ./dist

      - name: Set that the dist folder is not a Jekyll site
        run: touch ./dist/.nojekyll

      - name: Set CNAME to focus-shift.de
        run: echo "focus-shift.de" > ./dist/CNAME

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: ./dist
